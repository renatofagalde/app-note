name: 003 - Testes de Integração
run-name: "003 · Testes de Integração — ${{ github.event.workflow_run.head_branch }}"

on:
  workflow_run:
    workflows: ["002 - Qualidade de Código"]
    types:
      - completed
    branches:
      - 'feature/**'

jobs:
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check Docker
        run: docker version

      - name: Run integration tests (Testcontainers)
        run: |
          echo "🔍 Running integration tests with verbose output..."
          go test ./... -tags=integration -v -coverprofile=integration-coverage.out

          echo ""
          echo "📊 Test coverage summary:"
          go tool cover -func=integration-coverage.out | sed -n 's/^total:\s*(statements)\s*//p'

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: integration-coverage.out
